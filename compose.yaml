services:

  api:

    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mysql


  mysql:

    image: mysql:8

    environment:

      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

      MYSQL_DATABASE: ecommerce_support

    ports:

      - "3307:3306"

    volumes:

      - mysql_data:/var/lib/mysql


volumes:

  mysql_data: